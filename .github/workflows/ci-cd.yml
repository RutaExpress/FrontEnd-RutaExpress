name: RutaExpress Frontend CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop", "feature/*" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'README.md'
      - 'LICENSE'
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Test Angular App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mi-app-angular-msal

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./mi-app-angular-msal/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Angular Application
        run: npm run build -- --configuration=production

  docker-build:
    name: Build Docker Image (Localmente en CI)
    needs: build-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mi-app-angular-msal

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        # Construimos la imagen para verificar que el Dockerfile esté bien, 
        # pero NO la subimos a ningún lado (tal como pide el PDF)
        run: docker build -t rutaexpress-front:test .